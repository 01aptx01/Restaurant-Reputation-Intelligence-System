<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="520" fill="none">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="520" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top App Window Bar -->
  <rect width="900" height="42" rx="14" fill="#ffffff"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5.5" fill="#f43f5e"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
  <text x="450" y="26" fill="#475569" font-size="12" class="font-sans" font-weight="700" text-anchor="middle">Evaluation Dashboard · Multi-Model Benchmark &amp; Champion Selection</text>

  <g transform="translate(36, 60)">

    <!-- Champion Banner Strip -->
    <rect width="828" height="88" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
    <g transform="translate(24, 18)">
      <circle cx="26" cy="26" r="24" fill="#dcfce7"/>
      <text x="26" y="34" font-size="22" text-anchor="middle">🏆</text>

      <g transform="translate(68, 8)">
        <text x="0" y="16" fill="#166534" font-size="11" class="font-mono" font-weight="800" letter-spacing="1">CURRENT BENCHMARK CHAMPION</text>
        <text x="0" y="38" fill="#0f172a" font-size="20" class="font-sans" font-weight="900">xlmr · XLM-RoBERTa Large (Focal Loss + AMP)</text>
      </g>

      <!-- Champion Metric Pill -->
      <g transform="translate(560, 4)">
        <rect width="210" height="46" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="18" y="20" fill="#64748b" font-size="9.5" class="font-sans" font-weight="700">VAL MAE (LOWEST)</text>
        <text x="18" y="38" fill="#15803d" font-size="18" class="font-mono" font-weight="900">0.512 ★</text>
        <rect x="130" y="10" width="68" height="26" rx="6" fill="#dcfce7"/>
        <text x="164" y="27" fill="#15803d" font-size="10" class="font-mono" font-weight="800" text-anchor="middle">ACTIVE</text>
      </g>
    </g>

    <!-- Benchmark Comparison Table Container -->
    <g transform="translate(0, 106)" filter="url(#cardShadow)">
      <rect width="828" height="286" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

      <!-- Table Header -->
      <rect width="828" height="44" rx="14" fill="#f8fafc"/>
      <line x1="0" y1="44" x2="828" y2="44" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(24, 27)" fill="#64748b" font-size="10.5" class="font-sans" font-weight="700">
        <text x="0" y="0">ARCHITECTURE / MODEL</text>
        <text x="230" y="0">VAL MAE ↓</text>
        <text x="320" y="0">RMSE ↓</text>
        <text x="400" y="0">ACCURACY</text>
        <text x="490" y="0">OFF-BY-1</text>
        <text x="575" y="0">MACRO F1</text>
        <text x="660" y="0">SEVERE ERR (Δ≥2)</text>
        <text x="770" y="0">STATUS</text>
      </g>

      <!-- Row 1: XLM-R (Winner) -->
      <rect x="4" y="48" width="820" height="52" rx="8" fill="#f0fdf4"/>
      <g transform="translate(24, 79)" font-size="12" class="font-sans">
        <text x="0" y="0" fill="#166534" font-weight="800">xlmr (Fine-tuned)</text>
        <text x="230" y="0" fill="#15803d" class="font-mono" font-weight="900">0.512</text>
        <text x="320" y="0" fill="#334155" class="font-mono">0.724</text>
        <text x="400" y="0" fill="#334155" class="font-mono">68.4%</text>
        <text x="490" y="0" fill="#15803d" class="font-mono" font-weight="700">93.4%</text>
        <text x="575" y="0" fill="#334155" class="font-mono">0.781</text>
        <text x="660" y="0" fill="#15803d" class="font-mono" font-weight="800">3.2%</text>
        <!-- Badge -->
        <rect x="748" y="-14" width="46" height="20" rx="4" fill="#16a34a"/>
        <text x="771" y="0" fill="#ffffff" font-size="9" class="font-mono" font-weight="800" text-anchor="middle">BEST</text>
      </g>
      <line x1="16" y1="104" x2="812" y2="104" stroke="#f1f5f9"/>

      <!-- Row 2: Embedding -->
      <g transform="translate(24, 133)" font-size="12" class="font-sans">
        <text x="0" y="0" fill="#0f172a" font-weight="700">embedding (BGE-M3)</text>
        <text x="230" y="0" fill="#0f172a" class="font-mono" font-weight="700">0.598</text>
        <text x="320" y="0" fill="#64748b" class="font-mono">0.812</text>
        <text x="400" y="0" fill="#64748b" class="font-mono">63.1%</text>
        <text x="490" y="0" fill="#64748b" class="font-mono">89.2%</text>
        <text x="575" y="0" fill="#64748b" class="font-mono">0.714</text>
        <text x="660" y="0" fill="#64748b" class="font-mono">5.8%</text>
        <rect x="748" y="-14" width="46" height="20" rx="4" fill="#e2e8f0"/>
        <text x="771" y="0" fill="#475569" font-size="9" class="font-mono" font-weight="700" text-anchor="middle">READY</text>
      </g>
      <line x1="16" y1="158" x2="812" y2="158" stroke="#f1f5f9"/>

      <!-- Row 3: Baseline Optuna -->
      <g transform="translate(24, 187)" font-size="12" class="font-sans">
        <text x="0" y="0" fill="#0f172a" font-weight="700">baseline_optuna (5-CV)</text>
        <text x="230" y="0" fill="#0f172a" class="font-mono">0.641</text>
        <text x="320" y="0" fill="#64748b" class="font-mono">0.884</text>
        <text x="400" y="0" fill="#64748b" class="font-mono">59.8%</text>
        <text x="490" y="0" fill="#64748b" class="font-mono">86.1%</text>
        <text x="575" y="0" fill="#64748b" class="font-mono">0.672</text>
        <text x="660" y="0" fill="#64748b" class="font-mono">8.1%</text>
        <rect x="748" y="-14" width="46" height="20" rx="4" fill="#e2e8f0"/>
        <text x="771" y="0" fill="#475569" font-size="9" class="font-mono" font-weight="700" text-anchor="middle">TUNED</text>
      </g>
      <line x1="16" y1="212" x2="812" y2="212" stroke="#f1f5f9"/>

      <!-- Row 4: Baseline -->
      <g transform="translate(24, 241)" font-size="12" class="font-sans">
        <text x="0" y="0" fill="#64748b" font-weight="600">baseline (TF-IDF + XGB)</text>
        <text x="230" y="0" fill="#64748b" class="font-mono">0.718</text>
        <text x="320" y="0" fill="#94a3b8" class="font-mono">0.965</text>
        <text x="400" y="0" fill="#94a3b8" class="font-mono">55.2%</text>
        <text x="490" y="0" fill="#94a3b8" class="font-mono">82.5%</text>
        <text x="575" y="0" fill="#94a3b8" class="font-mono">0.628</text>
        <text x="660" y="0" fill="#e11d48" class="font-mono">11.4%</text>
        <rect x="748" y="-14" width="46" height="20" rx="4" fill="#f1f5f9"/>
        <text x="771" y="0" fill="#94a3b8" font-size="9" class="font-mono" font-weight="700" text-anchor="middle">BASE</text>
      </g>
    </g>

  </g>

  <!-- Bottom Caption Badge -->
  <g transform="translate(30, 474)">
    <rect width="400" height="34" rx="8" fill="#0f172a" fill-opacity="0.92"/>
    <text x="18" y="22" fill="#38bdf8" font-size="11.5" class="font-mono" font-weight="600">
      FEATURE 04 · Multi-Model Evaluation &amp; Champion Selection
    </text>
  </g>
</svg>
