<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="80" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="220" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="650" cy="180" r="140" fill="#e11d48" opacity="0.05" filter="url(#glow)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(60, 48)">
    <rect width="365" height="28" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="16" cy="14" r="5" fill="#10b981"/>
    <circle cx="16" cy="14" r="9" fill="#10b981" opacity="0.25"/>
    <text x="32" y="19" fill="#94a3b8" font-size="11.5" class="font-mono" font-weight="600" letter-spacing="1">BKK RESTAURANT ANOMALY ANALYTICS</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="128" fill="#ffffff" font-size="40" class="font-sans" font-weight="800" letter-spacing="-0.5">
    Restaurant Reputation Intelligence System
  </text>
  <text x="60" y="172" fill="url(#cyanGrad)" font-size="24" class="font-sans" font-weight="700">
    RRIS · Thai NLP &amp; Deep Learning Sentiment Discrepancy Engine
  </text>

  <!-- Subtitle / Mission -->
  <text x="60" y="218" fill="#94a3b8" font-size="14.5" class="font-sans" font-weight="400">
    End-to-End Enterprise ML Pipeline: Multi-Model Benchmark (Baseline · Embeddings · XLM-RoBERTa),
  </text>
  <text x="60" y="242" fill="#94a3b8" font-size="14.5" class="font-sans" font-weight="400">
    Discrepancy &amp; Review Fraud Detection, Optuna HPO, and High-Performance Geospatial Bun Web Serving.
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(60, 280)">
    <!-- Pill 1: 3 Production Models -->
    <g transform="translate(0, 0)">
      <rect width="215" height="42" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="7" fill="#0284c7" opacity="0.3"/>
      <circle cx="22" cy="21" r="3.5" fill="#38bdf8"/>
      <text x="38" y="26" fill="#e2e8f0" font-size="12" class="font-mono" font-weight="600">3x Model Zoo Pipeline</text>
    </g>

    <!-- Pill 2: Anomaly Engine -->
    <g transform="translate(230, 0)">
      <rect width="245" height="42" rx="10" fill="#0f172a" stroke="#e11d48" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="7" fill="#e11d48" opacity="0.3"/>
      <circle cx="22" cy="21" r="3.5" fill="#fb7185"/>
      <text x="38" y="26" fill="#e2e8f0" font-size="12" class="font-mono" font-weight="600">Discrepancy (Δ ≥ 2.0★)</text>
    </g>

    <!-- Pill 3: Auto Champion Selection -->
    <g transform="translate(490, 0)">
      <rect width="235" height="42" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="7" fill="#059669" opacity="0.3"/>
      <circle cx="22" cy="21" r="3.5" fill="#34d399"/>
      <text x="38" y="26" fill="#e2e8f0" font-size="12" class="font-mono" font-weight="600">Auto Champion (Val MAE)</text>
    </g>

    <!-- Pill 4: Bun + Elysia Geospatial -->
    <g transform="translate(740, 0)">
      <rect width="235" height="42" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="7" fill="#d97706" opacity="0.3"/>
      <circle cx="22" cy="21" r="3.5" fill="#fbbf24"/>
      <text x="38" y="26" fill="#e2e8f0" font-size="12" class="font-mono" font-weight="600">Bun + Elysia + Leaflet</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Shield Art -->
  <g transform="translate(1030, 110)">
    <circle cx="45" cy="45" r="55" fill="#0284c7" opacity="0.08" filter="url(#glow)"/>
    <circle cx="45" cy="45" r="45" stroke="#1e293b" stroke-width="2" fill="#0b1322"/>
    <path d="M45 20 L68 31 V52 C68 67 58 79 45 84 C32 79 22 67 22 52 V31 Z" fill="url(#cyanGrad)" opacity="0.85"/>
    <path d="M37 50 L43 56 L55 42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
