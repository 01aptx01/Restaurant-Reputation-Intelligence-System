<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="520" fill="none">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="pinGlowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pinGlowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Container Box / App Window Frame -->
  <rect width="900" height="520" rx="14" fill="url(#mapBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top App Window Bar -->
  <rect width="900" height="42" rx="14" fill="#ffffff"/>
  <line x1="0" y1="42" x2="900" y2="42" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5.5" fill="#f43f5e"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
  <rect x="220" y="8" width="460" height="26" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="450" y="25" fill="#64748b" font-size="11.5" class="font-mono" text-anchor="middle">http://127.0.0.1:8000/ — Bangkok Geospatial Anomaly Radar</text>

  <!-- Simulated Map Vector Background (Bangkok river & road networks) -->
  <g opacity="0.85">
    <!-- Chao Phraya River -->
    <path d="M 120 42 C 140 120, 100 200, 160 280 C 210 350, 190 420, 230 520" fill="none" stroke="#bae6fd" stroke-width="32" stroke-linecap="round"/>
    <path d="M 120 42 C 140 120, 100 200, 160 280 C 210 350, 190 420, 230 520" fill="none" stroke="#7dd3fc" stroke-width="20" stroke-linecap="round"/>

    <!-- Major Roads -->
    <!-- Sukhumvit Road -->
    <path d="M 170 270 Q 380 290 850 360" fill="none" stroke="#e2e8f0" stroke-width="14"/>
    <path d="M 170 270 Q 380 290 850 360" fill="none" stroke="#ffffff" stroke-width="10"/>
    <text x="560" y="322" fill="#94a3b8" font-size="10" class="font-sans" font-weight="600" transform="rotate(7 560 322)">SUKHUMVIT RD.</text>

    <!-- Rama 4 / Silom -->
    <path d="M 150 340 Q 420 380 720 460" fill="none" stroke="#ffffff" stroke-width="8"/>
    <text x="310" y="375" fill="#94a3b8" font-size="9" class="font-sans" font-weight="600">RAMA IV RD.</text>

    <!-- Phahon Yothin / Ari -->
    <path d="M 280 42 L 320 280" fill="none" stroke="#ffffff" stroke-width="9"/>
    <text x="295" y="140" fill="#94a3b8" font-size="9" class="font-sans" font-weight="600" transform="rotate(78 295 140)">PHAHON YOTHIN RD. (ARI)</text>

    <!-- Minor Arteries -->
    <path d="M 320 180 L 680 180" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M 450 100 L 450 420" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M 620 180 L 620 460" fill="none" stroke="#ffffff" stroke-width="6"/>
    <text x="628" y="240" fill="#94a3b8" font-size="9" class="font-sans" font-weight="600">THONGLOR RD.</text>
  </g>

  <!-- Map Markers (Pins) -->
  <!-- Clean Green Marker -->
  <g transform="translate(310, 160)" filter="url(#pinGlowGreen)">
    <circle cx="0" cy="0" r="14" fill="#059669" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#059669"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>
  <!-- Clean Green Marker 2 -->
  <g transform="translate(620, 220)">
    <circle cx="0" cy="0" r="12" fill="#059669" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="7" fill="#059669"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Amber Caution Marker -->
  <g transform="translate(430, 290)">
    <circle cx="0" cy="0" r="14" fill="#d97706" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="8" fill="#d97706"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Red Anomaly Flare Pin (Target Selected) -->
  <g transform="translate(520, 310)">
    <circle cx="0" cy="0" r="28" fill="#e11d48" fill-opacity="0.18">
      <animate attributeName="r" values="16;30;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="14" fill="#e11d48" filter="url(#pinGlowRed)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Zoom Callout: Selected Restaurant Popup Tooltip -->
  <g transform="translate(440, 140)" filter="url(#cardShadow)">
    <rect width="270" height="135" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Top badge -->
    <rect x="14" y="12" width="105" height="18" rx="9" fill="#ffe4e6"/>
    <text x="22" y="24.5" fill="#e11d48" font-size="9" class="font-sans" font-weight="700">⚠️ ANOMALY DETECTED</text>
    <text x="14" y="48" fill="#0f172a" font-size="13" class="font-sans" font-weight="700">Som Sak Seafood Express</text>
    <text x="14" y="64" fill="#64748b" font-size="10.5" class="font-sans">Sukhumvit 55 · Bangkok</text>

    <!-- Star Comparison pill -->
    <rect x="14" y="76" width="242" height="46" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="24" y="93" fill="#64748b" font-size="9" class="font-sans" font-weight="600">USER RATING</text>
    <text x="24" y="112" fill="#d97706" font-size="15" class="font-sans" font-weight="800">4.7 ★</text>

    <text x="130" y="93" fill="#64748b" font-size="9" class="font-sans" font-weight="600">AI PREDICTED</text>
    <text x="130" y="112" fill="#0284c7" font-size="15" class="font-sans" font-weight="800">2.1 ★</text>

    <rect x="198" y="86" width="48" height="26" rx="6" fill="#ffe4e6"/>
    <text x="222" y="103" fill="#e11d48" font-size="11" class="font-mono" font-weight="800" text-anchor="middle">Δ 2.6</text>

    <!-- Tooltip pointer triangle -->
    <polygon points="520,275 510,295 530,295" fill="#ffffff"/>
  </g>

  <!-- Top-Right Live HUD Stats Overlay -->
  <g transform="translate(680, 56)" filter="url(#cardShadow)">
    <rect width="190" height="74" rx="12" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0"/>
    <g transform="translate(18, 14)">
      <text x="0" y="24" fill="#0f172a" font-size="24" class="font-sans" font-weight="900">2,840</text>
      <text x="0" y="42" fill="#64748b" font-size="9.5" class="font-sans" font-weight="700" letter-spacing="1">TRACKED VENUES</text>
    </g>
    <line x1="104" y1="12" x2="104" y2="62" stroke="#f1f5f9" stroke-width="1.5"/>
    <g transform="translate(118, 14)">
      <text x="0" y="24" fill="#e11d48" font-size="24" class="font-sans" font-weight="900">312</text>
      <text x="0" y="42" fill="#e11d48" font-size="9.5" class="font-sans" font-weight="700" letter-spacing="1">ANOMALIES</text>
    </g>
  </g>

  <!-- Bottom Caption Badge -->
  <g transform="translate(30, 460)">
    <rect width="360" height="34" rx="8" fill="#0f172a" fill-opacity="0.92"/>
    <text x="18" y="22" fill="#38bdf8" font-size="11.5" class="font-mono" font-weight="600">
      FEATURE 01 · Geospatial Anomaly Radar
    </text>
  </g>
</svg>
